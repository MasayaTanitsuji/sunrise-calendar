<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上野原サンライズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
/* ============================================================
   CSS VARIABLES & RESET
   ============================================================ */
:root {
  --bg:       #0b0f18;
  --surf:     #131929;
  --surf2:    #1a2235;
  --surf3:    #1e2840;
  --border:   #2a3a5a;
  --border2:  #1e2d45;
  --text:     #e2eaf6;
  --sub:      #7a8fa8;
  --muted:    #4a5a70;
  --gold:     #f0c040;
  --gold2:    #d4a820;
  --gold-dim: rgba(240,192,64,.1);
  --r:        6px;
  --hdr-h:    52px;
  --time-col: 52px;   /* 時間軸の幅 */
  --day-min-w:140px;  /* 1日の最小幅 */
  --slot-h:   28px;   /* 30分1スロットの高さ */
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Noto Sans JP','Helvetica Neue',sans-serif;font-size:13px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

/* ============================================================
   LAYOUT
   ============================================================ */
#app { display:flex; flex-direction:column; height:100vh; overflow:hidden; }

/* HEADER */
header {
  height: var(--hdr-h);
  background: var(--surf);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 10px;
  flex-shrink: 0;
  z-index: 100;
}
.brand { display:flex; align-items:center; gap:8px; }
.brand-icon { font-size:22px; }
.brand strong { font-size:13px; font-weight:700; color:var(--gold); }
.brand small { font-size:10px; color:var(--sub); display:block; }
.badge { font-size:10px; font-weight:700; padding:3px 10px; border-radius:12px; white-space:nowrap; }
.badge.view { background:rgba(122,143,168,.15); color:var(--sub); border:1px solid var(--border); }
.badge.edit { background:rgba(240,192,64,.15); color:var(--gold); border:1px solid var(--gold2); }
.nav-row { display:flex; align-items:center; gap:7px; margin-left:auto; flex-wrap:wrap; }
.btn-s { background:var(--surf2); border:1px solid var(--border); color:var(--sub); padding:4px 10px; border-radius:var(--r); font-size:11px; font-weight:700; transition:all .12s; white-space:nowrap; }
.btn-s:hover { border-color:var(--sub); color:var(--text); }
.sync-dot { width:7px; height:7px; border-radius:50%; background:#69db7c; flex-shrink:0; }
.sync-dot.busy { background:var(--gold); }
.sync-dot.err  { background:#ff6b6b; }
.sync-label { font-size:10px; color:var(--sub); }
.week-label { font-size:13px; font-weight:700; font-family:'DM Mono',monospace; color:var(--gold); min-width:120px; text-align:center; }

/* Account selector */
.acct-btn { display:flex; align-items:center; gap:6px; background:var(--surf3); border:2px solid var(--border); border-radius:20px; padding:4px 12px 4px 10px; cursor:pointer; transition:all .15s; position:relative; user-select:none; }
.acct-btn .acct-name { font-size:11px; font-weight:700; color:var(--sub); }
.acct-btn .acct-arrow { font-size:9px; color:var(--muted); transition:transform .15s; }
.acct-btn.open .acct-arrow { transform:rotate(180deg); }
.acct-btn.logged-in { border-color:var(--gold); background:rgba(240,192,64,.15); box-shadow:0 0 12px rgba(240,192,64,.25); }
.acct-btn.logged-in .acct-name { color:var(--gold); font-size:12px; }
.acct-dropdown { display:none; position:fixed; background:var(--surf2); border:1px solid var(--border); border-radius:10px; min-width:180px; box-shadow:0 8px 32px rgba(0,0,0,.8); z-index:500; overflow-y:auto; max-height:70vh; }
.acct-dropdown.open { display:block; animation:fadeIn .14s ease; }
.acct-group-label { font-size:9px; font-weight:700; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; padding:8px 14px 4px; }
.acct-option { padding:8px 14px; font-size:12px; font-weight:500; color:var(--text); cursor:pointer; transition:background .1s; }
.acct-option:hover { background:var(--surf3); }
.acct-option.selected { color:var(--gold); background:var(--gold-dim); }
.acct-option.guest { color:var(--sub); border-bottom:1px solid var(--border2); }
.acct-divider { height:1px; background:var(--border2); margin:4px 0; }

/* ============================================================
   CALENDAR OUTER
   ============================================================ */
#calOuter {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* Sticky top: day-header row */
.cal-top {
  display: flex;
  flex-shrink: 0;
  border-bottom: 2px solid var(--border);
  background: var(--surf);
  position: sticky;
  top: 0;
  z-index: 50;
}
.cal-top-spacer { width: var(--time-col); flex-shrink:0; border-right:1px solid var(--border2); }
.day-hdr-wrap { display:flex; flex:1; overflow:hidden; }
.day-hdr {
  flex: 1;
  min-width: var(--day-min-w);
  padding: 6px 8px;
  border-right: 1px solid var(--border2);
  text-align: center;
  font-size: 11px;
  font-weight: 700;
}
.day-hdr:last-child { border-right: none; }
.day-hdr .dh-num { font-size:20px; font-weight:700; font-family:'DM Mono',monospace; display:block; line-height:1.1; }
.day-hdr .dh-dow { font-size:10px; font-weight:700; letter-spacing:.05em; }
.day-hdr.is-sun .dh-num, .day-hdr.is-sun .dh-dow { color:#ff8787; }
.day-hdr.is-sat .dh-num, .day-hdr.is-sat .dh-dow { color:#74c0fc; }
.day-hdr.is-today { background:rgba(240,192,64,.08); }
.day-hdr.is-today .dh-num { color:var(--gold); }
.dh-badges { display:flex; gap:3px; flex-wrap:wrap; justify-content:center; margin-top:4px; }
.dh-badge { font-size:8px; font-weight:700; padding:1px 5px; border-radius:8px; white-space:nowrap; }
.dh-badge.off     { background:rgba(255,100,100,.15); color:#ff8787; border:1px solid rgba(255,100,100,.2); }
.dh-badge.yama    { background:rgba(240,192,64,.15);  color:var(--gold); border:1px solid rgba(240,192,64,.2); }
.dh-badge.tokyo   { background:rgba(130,177,255,.15); color:#82b1ff;  border:1px solid rgba(130,177,255,.2); }
.dh-badge.exe     { background:rgba(255,215,0,.12);   color:#ffd700;  border:1px solid rgba(255,165,0,.3); }
.dh-badge.rbl     { background:rgba(130,177,255,.12); color:#82b1ff;  border:1px solid rgba(51,154,240,.3); }
.dh-att { font-size:8px; padding:1px 5px; border-radius:8px; background:rgba(81,207,102,.12); color:#69db7c; border:1px solid rgba(81,207,102,.22); }
.dh-abs { font-size:8px; padding:1px 5px; border-radius:8px; background:rgba(255,107,107,.12); color:#ff8787; border:1px solid rgba(255,107,107,.22); }

/* Scrollable body */
.cal-scroll-wrap {
  flex: 1;
  overflow: auto;
  position: relative;
}
.cal-grid {
  display: flex;
  min-height: calc(var(--slot-h) * 36); /* 6:00〜24:00 = 36slots */
  position: relative;
}

/* Time axis */
.time-axis {
  width: var(--time-col);
  flex-shrink: 0;
  border-right: 1px solid var(--border2);
  position: sticky;
  left: 0;
  z-index: 20;
  background: var(--surf);
}
.time-slot {
  height: var(--slot-h);
  display: flex;
  align-items: flex-start;
  padding-top: 2px;
  padding-right: 6px;
  justify-content: flex-end;
  font-size: 9px;
  color: var(--muted);
  font-family: 'DM Mono',monospace;
  border-bottom: 1px solid transparent;
  position: relative;
}
.time-slot.hour { color:var(--sub); font-size:10px; }
.time-slot.hour::after {
  content: '';
  position: absolute;
  right: 0;
  bottom: 0;
  width: 4px;
  height: 1px;
  background: var(--border);
}

/* Day columns */
.day-cols { display:flex; flex:1; }
.day-col {
  flex: 1;
  min-width: var(--day-min-w);
  border-right: 1px solid var(--border2);
  position: relative;
}
.day-col:last-child { border-right: none; }
.day-col.is-today { background:rgba(240,192,64,.02); }

/* Hour lines */
.hour-line {
  position: absolute;
  left: 0; right: 0;
  height: 1px;
  background: var(--border2);
  pointer-events: none;
  z-index: 1;
}
.hour-line.major { background: var(--border); }

/* Current time indicator */
.now-line {
  position: absolute;
  left: 0; right: 0;
  height: 2px;
  background: #ff6b6b;
  z-index: 10;
  pointer-events: none;
}
.now-line::before {
  content: '';
  position: absolute;
  left: -4px;
  top: -4px;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #ff6b6b;
}

/* Events */
.event-block {
  position: absolute;
  left: 3px; right: 3px;
  border-radius: 5px;
  padding: 3px 6px;
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
  overflow: hidden;
  z-index: 5;
  border-left: 3px solid transparent;
  transition: opacity .1s, filter .1s;
  line-height: 1.3;
}
.event-block:hover { filter:brightness(1.15); }
.event-block .ev-title { font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.event-block .ev-time  { font-size:9px; opacity:.8; font-family:'DM Mono',monospace; }
.event-block .ev-att   { font-size:9px; margin-top:2px; }
.event-block.match-block { border-width:2px; }

/* Add event area (click on empty slot) */
.slot-hover {
  position: absolute;
  left: 0; right: 0;
  height: var(--slot-h);
  background: transparent;
  transition: background .1s;
  cursor: pointer;
  z-index: 2;
}
.slot-hover:hover { background: rgba(240,192,64,.06); }
.view-mode .slot-hover { cursor: default; }
.view-mode .slot-hover:hover { background: transparent; }

/* ============================================================
   MODALS
   ============================================================ */
.overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:200; align-items:flex-start; justify-content:center; overflow-y:auto; -webkit-overflow-scrolling:touch; backdrop-filter:blur(5px); padding:20px 16px 40px; }
.overlay.open { display:flex; }
.modal { background:var(--surf2); border:1px solid var(--border); border-radius:12px; padding:22px; width:380px; max-width:100%; box-shadow:0 20px 60px rgba(0,0,0,.65); animation:fadeIn .16s ease; margin:auto; }
@keyframes fadeIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
.modal h3 { font-size:13px; font-weight:700; color:var(--gold); margin-bottom:16px; }
.fg { margin-bottom:12px; }
.fg label { font-size:10px; font-weight:700; color:var(--sub); display:block; margin-bottom:4px; letter-spacing:.05em; text-transform:uppercase; }
.fg input, .fg select, .fg textarea {
  width:100%; background:var(--surf3); border:1px solid var(--border); border-radius:var(--r);
  color:var(--text); padding:8px 10px; font-size:12px; outline:none; transition:border-color .12s;
}
.fg input:focus, .fg select:focus, .fg textarea:focus { border-color:var(--gold2); }
.fg select option { background:var(--surf2); }
.time-row { display:flex; gap:8px; align-items:center; }
.time-row span { color:var(--sub); font-size:11px; }
.time-sel { flex:1; background:var(--surf3); border:1px solid var(--border); border-radius:var(--r); color:var(--text); padding:8px 10px; font-size:12px; outline:none; font-family:inherit; cursor:pointer; }
.time-sel:focus { border-color:var(--gold2); }
.time-sel option { background:var(--surf2); }
.mfoot { display:flex; gap:8px; margin-top:18px; }
.btn-cancel { flex:1; background:none; border:1px solid var(--border); color:var(--sub); padding:9px; border-radius:7px; font-size:12px; font-weight:700; }
.btn-save   { flex:2; background:var(--gold); border:none; color:#0b0f18; padding:9px; border-radius:7px; font-size:12px; font-weight:700; }
.btn-save:hover { background:#f5d060; }
.btn-del    { background:none; border:1px solid #ff6b6b; color:#ff6b6b; padding:9px 14px; border-radius:7px; font-size:12px; font-weight:700; }
.btn-join   { flex:2; background:#1e7a33; border:none; color:#fff; padding:9px; border-radius:7px; font-size:12px; font-weight:700; }
.btn-absent { flex:2; background:#7a1a1a; border:none; color:#fff; padding:9px; border-radius:7px; font-size:12px; font-weight:700; }

/* Detail modal */
.detail-modal { background:var(--surf2); border:1px solid var(--border); border-radius:12px; width:400px; max-width:100%; box-shadow:0 20px 60px rgba(0,0,0,.65); margin:auto; overflow:hidden; animation:fadeIn .16s ease; }
.dm-hdr { padding:16px 20px 12px; border-bottom:1px solid var(--border2); }
.dm-hdr h3 { font-size:14px; font-weight:700; margin-bottom:4px; }
.dm-hdr h3.match { color:#ffd700; }
.dm-meta { font-size:11px; color:var(--sub); display:flex; align-items:center; gap:8px; }
.dm-body { padding:16px 20px; }
.dm-row { display:flex; gap:12px; margin-bottom:10px; }
.dm-lbl { font-size:10px; font-weight:700; color:var(--sub); min-width:52px; padding-top:2px; text-transform:uppercase; letter-spacing:.05em; }
.dm-val { font-size:12px; color:var(--text); flex:1; line-height:1.5; }
.att-list { display:flex; flex-wrap:wrap; gap:4px; }
.att-chip { font-size:10px; padding:2px 8px; border-radius:10px; }
.att-chip.p  { background:rgba(81,207,102,.12); color:#69db7c; border:1px solid rgba(81,207,102,.22); }
.att-chip.fo { background:rgba(130,177,255,.08); color:#74c0fc; border:1px solid rgba(130,177,255,.2); }
.att-chip.ab { background:rgba(255,107,107,.12); color:#ff8787; border:1px solid rgba(255,107,107,.22); }
.dm-footer { padding:12px 20px; border-top:1px solid var(--border2); display:flex; gap:8px; justify-content:flex-end; }
.dm-btn { padding:7px 16px; border-radius:7px; font-size:12px; font-weight:700; cursor:pointer; border:none; }
.dm-btn.close { background:none; border:1px solid var(--border); color:var(--sub); }
.dm-btn.join  { background:#1e7a33; color:#fff; }
.dm-btn.absent{ background:#7a1a1a; color:#fff; }

/* Absent reason modal */
.ab-reason { width:100%; background:var(--surf3); border:1px solid var(--border); border-radius:var(--r); color:var(--text); padding:8px 10px; font-size:12px; outline:none; resize:none; }
.ab-reason:focus { border-color:var(--gold2); }

/* Toast */
.toast { position:fixed; bottom:22px; right:22px; background:#1e7a33; color:#fff; padding:9px 15px; border-radius:8px; font-size:12px; z-index:400; opacity:0; transform:translateY(8px); transition:all .22s; pointer-events:none; }
.toast.show { opacity:1; transform:translateY(0); }

/* Board button */
.board-btn-wrap { position:relative; display:inline-block; }
.board-badge { position:absolute; top:-4px; right:-4px; background:#ff6b6b; color:#fff; font-size:9px; font-weight:700; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; display:none; }

/* Confirm modal */
.confirm-modal { background:var(--surf2); border:1px solid var(--border); border-radius:12px; padding:24px; width:320px; max-width:100%; margin:auto; animation:fadeIn .16s ease; }
.confirm-modal h3 { font-size:14px; font-weight:700; color:#ff6b6b; margin-bottom:12px; }
.confirm-modal p  { font-size:12px; color:var(--sub); margin-bottom:18px; line-height:1.6; }
.btn-confirm-del { background:#c0392b; border:none; color:#fff; padding:9px 20px; border-radius:7px; font-size:12px; font-weight:700; cursor:pointer; }
.btn-confirm-del:hover { background:#e74c3c; }

/* ============================================================
   BOARD (掲示板)
   ============================================================ */
.board-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:300; align-items:flex-start; justify-content:center; overflow-y:auto; padding:20px 16px 40px; backdrop-filter:blur(6px); }
.board-overlay.open { display:flex; }
.board-modal { background:var(--surf2); border:1px solid var(--border); border-radius:14px; width:520px; max-width:100%; box-shadow:0 24px 80px rgba(0,0,0,.7); margin:auto; overflow:hidden; }
.board-hdr { padding:16px 20px 12px; border-bottom:1px solid var(--border2); display:flex; align-items:center; gap:10px; }
.board-hdr h3 { font-size:14px; font-weight:700; color:var(--gold); flex:1; margin:0; }
.board-close { background:none; border:1px solid var(--border); color:var(--sub); width:28px; height:28px; border-radius:6px; cursor:pointer; font-size:14px; line-height:28px; text-align:center; }
.board-posts { padding:12px 0; max-height:50vh; overflow-y:auto; }
.board-post { padding:12px 20px; border-bottom:1px solid var(--border2); }
.board-post:last-child { border-bottom:none; }
.board-post-hdr { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.board-post-time { font-size:10px; color:#a0b4c8; font-weight:500; }
.board-post-author { font-size:11px; font-weight:700; color:var(--gold); }
.board-post-author.fo { color:#82b1ff; }
.board-post-body { font-size:12px; color:var(--text); line-height:1.6; white-space:pre-wrap; }
.board-post-del { background:none; border:none; color:var(--muted); font-size:10px; cursor:pointer; padding:0 4px; display:none; margin-left:auto; }
.board-post:hover .board-post-del { display:inline; }
.board-post-del:hover { color:#ff6b6b; }
.board-ack-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:8px; padding-top:8px; border-top:1px dashed var(--border2); }
.board-ack-lbl { font-size:10px; color:var(--muted); }
.board-ack-tag { font-size:10px; padding:1px 7px; border-radius:10px; background:rgba(130,177,255,.1); color:#74c0fc; border:1px solid rgba(130,177,255,.2); }
.board-ack-btn { font-size:10px; padding:2px 10px; border-radius:10px; background:none; border:1px dashed rgba(130,177,255,.3); color:var(--sub); cursor:pointer; transition:all .12s; font-family:inherit; }
.board-ack-btn:hover, .board-ack-btn.acked { background:rgba(130,177,255,.15); color:#74c0fc; border-style:solid; border-color:rgba(130,177,255,.4); }
.board-compose { padding:12px 20px; border-top:1px solid var(--border2); background:var(--surf3); }
.board-compose-who { font-size:11px; font-weight:700; color:var(--sub); margin-bottom:6px; }
.board-compose-who span { color:var(--gold); }
.board-textarea { width:100%; background:var(--surf2); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:12px; font-family:inherit; padding:10px 12px; outline:none; resize:none; line-height:1.5; }
.board-textarea:focus { border-color:var(--gold2); }
.board-send-row { display:flex; justify-content:flex-end; margin-top:8px; gap:8px; align-items:center; }
.board-char { font-size:10px; color:var(--muted); }
.board-send { background:var(--gold); border:none; color:#0b0f18; padding:7px 18px; border-radius:7px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; }
.board-send:hover { background:#f5d060; }
.board-empty { padding:30px 20px; text-align:center; color:var(--muted); font-size:12px; }

/* ============================================================
   RIGHT PANEL (スケジュール一覧)
   ============================================================ */
.main-area { display:flex; flex:1; overflow:hidden; }
.side-panel { width:280px; flex-shrink:0; position:relative; height:100%; overflow-y:auto; background:var(--surf); border-left:1px solid var(--border); display:flex; flex-direction:column; }
.side-panel-hdr { padding:12px 14px 10px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surf); z-index:2; }
.side-panel-hdr h4 { font-size:11px; font-weight:700; color:var(--gold); letter-spacing:.08em; text-transform:uppercase; margin:0; }
.side-panel-hdr small { font-size:10px; color:var(--sub); }
.sch-item { padding:10px 14px; border-bottom:1px solid var(--border2); cursor:pointer; transition:background .1s; }
.sch-item:hover { background:var(--surf2); }
.sch-date-row { font-size:10px; font-family:'DM Mono',monospace; color:var(--sub); margin-bottom:3px; display:flex; align-items:center; gap:6px; }
.sch-dow { font-size:9px; padding:1px 5px; border-radius:3px; }
.sch-dow.sun { background:var(--surf3); color:#ff8787; }
.sch-dow.sat { background:var(--surf3); color:#74c0fc; }
.sch-dow.wkd { background:var(--surf3); color:var(--sub); }
.sch-title { font-size:11px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sch-title.match { color:#ffd700; }
.sch-time { font-size:10px; color:var(--muted); font-family:'DM Mono',monospace; }
.sch-att-row { display:flex; gap:4px; flex-wrap:wrap; margin-top:3px; }
.sch-att-pill { font-size:9px; padding:1px 6px; border-radius:8px; background:rgba(81,207,102,.1); color:#69db7c; border:1px solid rgba(81,207,102,.2); }
.sch-month-lbl { padding:8px 14px 4px; font-size:10px; font-weight:700; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; background:var(--bg); }
.sch-empty { padding:20px 14px; color:var(--muted); font-size:11px; }

  { id:'g', name:'峡田ふれあい館',    nameEn:'Kyoda Hall',        bg:'#2a1a2e', fg:'#ce93d8', bd:'#ab47bc' },
  { id:'h', name:'夕やけこやけふれあい館',nameEn:'Yuyake Hall',   bg:'#1a2a1a', fg:'#a5d6a7', bd:'#66bb6a' },
  { id:'i', name:'その他',          nameEn:'Other',                bg:'#1a1e24', fg:'#9e9e9e', bd:'#6c757d' },
  { id:'j', name:'試合会場',        nameEn:'Match Venue',          bg:'#1a1500', fg:'#ffd700', bd:'#ffa500' },
];

const PLAYERS      = ['Abe','Chiba','Dewa','Hoshi','Kanekubo','Petar','Saito','Saeki','Shimizu','Shinada','Teo'];
const FRONT_OFFICE = ['Baba','Hasegawa','Hayashi','Machi','Omata','Onaga','Sachi','Shibata','Tachikawa','Tanitsuji'];
const ALL_MEMBERS  = [...PLAYERS, ...FRONT_OFFICE];
const NAME_JA = {
  Abe:'阿部',Chiba:'千葉',Dewa:'出羽',Hoshi:'星',Kanekubo:'金久保',
  Petar:'ペタ',Saito:'斉藤',Saeki:'佐伯',Shimizu:'清水',Shinada:'品田',Teo:'テオ',
  Baba:'馬場',Hasegawa:'長谷川',Hayashi:'林',Machi:'真智',Omata:'小俣',
  Onaga:'翁長',Sachi:'沙智',Shibata:'柴田',Tachikawa:'立川',Tanitsuji:'谷辻'
};
const EDIT_KEY = 'sunrise2026';
const DAY_START = 6;   // 6:00
const DAY_END   = 24;  // 24:00
const SLOTS     = (DAY_END - DAY_START) * 2; // 36 half-hour slots

// ============================================================
//  STATE
// ============================================================
let lang    = 'ja';
let isEdit  = false;
let currentUser = localStorage.getItem('sunrise_user_v2') || '';
let weekStart   = getWeekStart(new Date());
let data = { events:{}, attendance:{}, absence:{} };
let _pEvt    = null;  // pending event for modal
let _pDetail = null;  // pending detail for att/absent
let _pDel    = null;  // pending delete
let _boardPosts = [];
let _amTab   = 'players';

// ============================================================
//  HELPERS
// ============================================================
function dn(name) { return lang==='ja' && NAME_JA[name] ? NAME_JA[name] : name; }
function facName(id) {
  const f = FAC_BASE.find(x=>x.id===id);
  if (!f) return id;
  return lang==='ja' ? f.name : f.nameEn;
}
function fmtDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getWeekStart(d) {
  const dt = new Date(d);
  const day = (dt.getDay()+6)%7; // Mon=0
  dt.setDate(dt.getDate()-day);
  dt.setHours(0,0,0,0);
  return dt;
}
function timeToSlot(timeStr) {
  // "09:30" → slot index from DAY_START
  const [h,m] = timeStr.split(':').map(Number);
  return (h - DAY_START)*2 + (m>=30?1:0);
}
function slotToY(slot) { return slot * SLOT_H(); }
function SLOT_H() {
  return parseInt(getComputedStyle(document.documentElement).getPropertyValue('--slot-h')) || 28;
}
function timeToY(timeStr) {
  const [h,m] = timeStr.split(':').map(Number);
  const mins = (h - DAY_START)*60 + m;
  return mins / 30 * SLOT_H();
}
function slotToTime(slot) {
  const totalMins = slot*30 + DAY_START*60;
  const h = Math.floor(totalMins/60);
  const m = totalMins%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function durationMins(start, end) {
  const [sh,sm] = start.split(':').map(Number);
  const [eh,em] = end.split(':').map(Number);
  return (eh*60+em)-(sh*60+sm);
}
function nowY() {
  const now = new Date();
  const mins = (now.getHours()-DAY_START)*60 + now.getMinutes();
  if (mins<0 || mins>(DAY_END-DAY_START)*60) return null;
  return mins/30*SLOT_H();
}
function formatTimeStr(t) {
  // "09:30:00" or "09:30" → "9:30"
  const [h,m] = t.split(':');
  return `${parseInt(h)}:${m}`;
}
function getDaySched(dow) {
  if (dow===1) return 'off';
  if (dow===2||dow===3) return 'yama';
  if (dow===5) return 'tokyo';
  return null;
}
function absentName(e) { return typeof e==='string'?e:e.name; }
function absentReason(e) { return typeof e==='string'?'':e.reason||''; }
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function showToast(msg) {
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// ============================================================
//  SYNC STATUS
// ============================================================
function setSyncing(state, msg) {
  const dot=document.getElementById('syncDot');
  const lbl=document.getElementById('syncLbl');
  dot.className='sync-dot'+(state==='busy'?' busy':state==='err'?' err':'');
  lbl.textContent=msg;
}

// ============================================================
//  DATA LOAD / SAVE
// ============================================================
async function loadData() {
  setSyncing('busy','読み込み中…');
  const fb = window.fbLoad ? await window.fbLoad() : null;
  if (fb) {
    data = fb;
    if (!data.events)     data.events     = {};
    if (!data.attendance) data.attendance = {};
    if (!data.absence)    data.absence    = {};
  }
  setSyncing('ok','Ready');
}
async function saveData() {
  setSyncing('busy','保存中…');
  if (window.fbSave) { await window.fbSave(data); setSyncing('ok','保存済'); }
  else { setSyncing('err','保存失敗'); }
}

// ============================================================
//  EVENT CRUD
// ============================================================
function genId() { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function getEventsForDay(ds) {
  return Object.entries(data.events||{})
    .filter(([id,e])=>e.date===ds)
    .map(([id,e])=>({id,...e}))
    .sort((a,b)=>a.start.localeCompare(b.start));
}

function getAllFutureEvents() {
  const today = new Date(); today.setHours(0,0,0,0);
  return Object.entries(data.events||{})
    .map(([id,e])=>({id,...e}))
    .filter(e=>new Date(e.date+'T00:00:00')>=today)
    .sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));
}

// ============================================================
//  RENDER CALENDAR
// ============================================================
function render() {
  renderWeekLabel();
  renderDayHeaders();
  renderTimeAxis();
  renderDayCols();
  renderSidePanel();
  renderNowLine();
}

function renderWeekLabel() {
  const we = new Date(weekStart); we.setDate(we.getDate()+6);
  const fmt=(d)=>`${d.getMonth()+1}/${d.getDate()}`;

function renderDayHeaders() {
  const wrap = document.getElementById('dayHdrWrap');
  wrap.innerHTML='';
  const today = new Date(); today.setHours(0,0,0,0);
  const DOW_JA = ['日','月','火','水','木','金','土'];
  const DOW_EN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  for (let i=0;i<7;i++) {
    const dt = new Date(weekStart); dt.setDate(dt.getDate()+i);
    const dow = dt.getDay();
    const isToday = dt.getTime()===today.getTime();
    const sched = getDaySched(dow);
    const ds = fmtDate(dt);

    const div = document.createElement('div');
    div.className='day-hdr'
      +(dow===0?' is-sun':dow===6?' is-sat':'')
      +(isToday?' is-today':'');

    const numEl=document.createElement('span'); numEl.className='dh-num'; numEl.textContent=dt.getDate();
    const dowEl=document.createElement('span'); dowEl.className='dh-dow';
    dowEl.textContent=lang==='ja'
      ? `${dt.getMonth()+1}月 ${DOW_JA[dow]}`
      : `${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dt.getMonth()]} ${DOW_EN[dow]}`;
    div.appendChild(numEl); div.appendChild(dowEl);

    // Badges row
    const badgeRow=document.createElement('div'); badgeRow.className='dh-badges';
    if(sched){
      const sb=document.createElement('span'); sb.className='dh-badge '+sched;
      sb.textContent=sched==='off'?'OFF':sched==='yama'?(lang==='ja'?'山梨':'Yamanashi'):(lang==='ja'?'東京':'Tokyo');
      badgeRow.appendChild(sb);
    }
    // Match badges from events
    getEventsForDay(ds).forEach(ev=>{
      if(ev.purpose==='試合'||ev.purpose==='Match'){
        const isExe=ev.memo&&ev.memo.includes('EXE');
        const isRbl=ev.memo&&ev.memo.includes('RBL');
        if(isExe||isRbl){
          const lb=document.createElement('span');
          lb.className='dh-badge '+(isExe?'exe':'rbl');
          const m=ev.memo&&ev.memo.match(/（(.+?)）/);
          lb.textContent=(isExe?'EXE':'RBL')+(m?` ${m[1]}`:'');
          badgeRow.appendChild(lb);
        }
      }
    });
    // Att/abs count
    const dayAtt=(data.attendance||{})[ds]||{};
    const dayAbs=(data.absence||{})[ds]||{};
    const uP=new Set(),uF=new Set(),uAP=new Set(),uAF=new Set();
    Object.values(dayAtt).forEach(names=>(names||[]).forEach(n=>{if(FRONT_OFFICE.includes(n))uF.add(n);else uP.add(n);}));
    Object.values(dayAbs).forEach(entries=>(entries||[]).forEach(e=>{const n=absentName(e);if(FRONT_OFFICE.includes(n))uAF.add(n);else uAP.add(n);}));
    if(uP.size||uF.size){
      const ac=document.createElement('span');ac.className='dh-att';
      const pts=[];if(uP.size)pts.push(lang==='ja'?`選手${uP.size}`:`${uP.size}P`);if(uF.size)pts.push(`FO${uF.size}`);
      ac.textContent=(lang==='ja'?'参加 ':'✓')+pts.join('/');badgeRow.appendChild(ac);
    }
    if(uAP.size||uAF.size){
      const xc=document.createElement('span');xc.className='dh-abs';
      const xts=[];if(uAP.size)xts.push(lang==='ja'?`選手${uAP.size}`:`${uAP.size}P`);if(uAF.size)xts.push(`FO${uAF.size}`);
      xc.textContent=(lang==='ja'?'欠席 ':'✗')+xts.join('/');badgeRow.appendChild(xc);
    }
    div.appendChild(badgeRow);
    wrap.appendChild(div);
  }
}

function renderDayCols() {

  for(let i=0;i<7;i++){

function renderEventBlock(col, ev, ds) {
  const sh=SLOT_H();
  const startY=timeToY(ev.start);
  const durMins=durationMins(ev.start,ev.end);
  const h=Math.max(durMins/30*sh, sh*0.8);

  const fac=FAC_BASE.find(x=>x.id===ev.facId)||FAC_BASE[8];
  const isMatch=ev.purpose==='試合'||ev.purpose==='Match';

  const block=document.createElement('div');
  block.className='event-block'+(isMatch?' match-block':'');
  block.style.cssText=`top:${startY}px;height:${h}px;background:${fac.bg};color:${fac.fg};border-left-color:${fac.bd}`;

  const title=isMatch
    ? `⚔ ${ev.memo||facName(ev.facId)}`
    : `${facName(ev.facId)}${ev.purpose&&ev.purpose!=='チーム練習'&&ev.purpose!=='Team Practice'?` · ${ev.purpose}`:''}`;

  // Attendance count
  const atts=((data.attendance||{})[ds]||{})[ev.id]||[];
  const absents=((data.absence||{})[ds]||{})[ev.id]||[];

  block.innerHTML=`
    <div class="ev-title">${title}</div>
    ${h>sh*1.2?`<div class="ev-time">${formatTimeStr(ev.start)}–${formatTimeStr(ev.end)}</div>`:''}
    ${atts.length||absents.length?`<div class="ev-att">${atts.length?`✓${atts.length}`:''}${absents.length?` ✗${absents.length}`:''}</div>`:''}
  `;

  block.addEventListener('click',(e)=>{ e.stopPropagation(); openDetail(ev,ds); });
  col.appendChild(block);
}

function buildFacSelect(){
  const sel=document.getElementById('evFac');
  sel.innerHTML='';
  FAC_BASE.forEach(f=>{
    const o=document.createElement('option');
    o.value=f.id;
    o.textContent=lang==='ja'?f.name:f.nameEn;
    sel.appendChild(o);
  });
}

function buildTimeSelects(startVal, endVal) {
  const startSel = document.getElementById('evStart');
  const endSel   = document.getElementById('evEnd');
  startSel.innerHTML = '';
  endSel.innerHTML   = '';
  for (let h = 6; h <= 24; h++) {
    for (let m = 0; m < 60; m += 30) {
      if (h === 24 && m > 0) break;
      const timeStr = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      const label   = `${h}:${String(m).padStart(2,'0')}`;
      const os = document.createElement('option'); os.value = timeStr; os.textContent = label;
      const oe = document.createElement('option'); oe.value = timeStr; oe.textContent = label;
      startSel.appendChild(os);
      endSel.appendChild(oe);
    }
  }
  if (startVal) startSel.value = startVal;
  if (endVal)   endSel.value   = endVal;
}

function saveEvent(){
  const ds=_pEvt.ds;
  const facId=document.getElementById('evFac').value;
  const purpose=document.getElementById('evPurpose').value;
  const start=document.getElementById('evStart').value;
  const end=document.getElementById('evEnd').value;
  const memo=document.getElementById('evMemo').value.trim();
  const privateNote=document.getElementById('evPrivate').value.trim();
  if(!start||!end||start>=end){showToast('時刻を正しく入力してください');return;}
  if(!data.events) data.events={};
  const id=_pEvt.id||genId();
  data.events[id]={date:ds,facId,purpose,start,end,memo,privateNote};
  closeModal('evOv');saveData();render();showToast('保存しました');
}

function confirmDelEvent(){
  _pDel=_pEvt;
  closeModal('evOv');

}
function execDelEvent(){
  if(_pDel&&_pDel.id&&data.events[_pDel.id]){
    delete data.events[_pDel.id];
    // also clean up attendance/absence for this event
    Object.keys(data.attendance||{}).forEach(ds=>{delete (data.attendance[ds]||{})[_pDel.id];});
    Object.keys(data.absence||{}).forEach(ds=>{delete (data.absence[ds]||{})[_pDel.id];});
    saveData();render();showToast('削除しました');
  }
  closeModal('confirmOv');_pDel=null;
}

    ? `⚔ ${ev.memo||facName(ev.facId)}`
    : `${facName(ev.facId)}${ev.purpose&&ev.purpose!=='チーム練習'?` · ${ev.purpose}`:''}`;
  document.getElementById('dm-title').textContent=title;
  document.getElementById('dm-title').className=isMatch?'match':'';

  const dateStr=lang==='ja'
    ?`${dt.getMonth()+1}月${dt.getDate()}日（${dowLabel}）`
    :`${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dt.getMonth()]} ${dt.getDate()} (${dowLabel})`;

  // Body
  const atts=((data.attendance||{})[ds]||{})[ev.id]||[];
  const absents=((data.absence||{})[ds]||{})[ev.id]||[];
  const players=atts.filter(n=>PLAYERS.includes(n));
  const fo=atts.filter(n=>FRONT_OFFICE.includes(n));
  const abP=absents.filter(e=>PLAYERS.includes(absentName(e)));
  const abF=absents.filter(e=>FRONT_OFFICE.includes(absentName(e)));

  let html=`<div class="dm-row"><div class="dm-lbl">${lang==='ja'?'施設':'Venue'}</div><div class="dm-val" style="display:flex;align-items:center;gap:6px"><span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;background:${fac.bg};color:${fac.fg};border-left:3px solid ${fac.bd}">${facName(ev.facId)}</span></div></div>`;
  if(ev.memo) html+=`<div class="dm-row"><div class="dm-lbl">${lang==='ja'?'メモ':'Notes'}</div><div class="dm-val">${escHtml(ev.memo)}</div></div>`;
  if(ev.privateNote && isEdit) html+=`<div class="dm-row"><div class="dm-lbl" style="color:#ffd700">🔒 ${lang==='ja'?'内部':'Internal'}</div><div class="dm-val" style="color:#ffd700;opacity:.85">${escHtml(ev.privateNote)}</div></div>`;

  // Attendance
  html+=`<div class="dm-row"><div class="dm-lbl">${lang==='ja'?'参加':'Join'}</div><div class="dm-val"><div class="att-list">`;
  if(!atts.length) html+=`<span style="color:var(--muted);font-size:11px;font-style:italic">${lang==='ja'?'まだなし':'None yet'}</span>`;
  players.forEach(n=>html+=`<span class="att-chip p">✓ ${dn(n)}</span>`);
  fo.forEach(n=>html+=`<span class="att-chip fo">✓ ${dn(n)}</span>`);
  html+=`</div></div></div>`;

  // Absences
  if(absents.length){
    html+=`<div class="dm-row"><div class="dm-lbl">${lang==='ja'?'欠席':'Absent'}</div><div class="dm-val"><div class="att-list">`;
    absents.forEach(e=>html+=`<span class="att-chip ab" title="${escHtml(absentReason(e))}">✗ ${dn(absentName(e))}${absentReason(e)?` (${escHtml(absentReason(e))})`:''}</span>`);
    html+=`</div></div></div>`;

function joinFromDetail(){
  if(!_pDetail) return;
  const {ev,ds}=_pDetail;
  if(!currentUser){ showToast(lang==='ja'?'名前を選択してください':'Please select your name'); return; }
  if(!data.attendance)data.attendance={};
  if(!data.attendance[ds])data.attendance[ds]={};
  if(!data.attendance[ds][ev.id])data.attendance[ds][ev.id]=[];
  const arr=data.attendance[ds][ev.id];
  if(arr.includes(currentUser)){
    data.attendance[ds][ev.id]=arr.filter(n=>n!==currentUser);
    showToast(lang==='ja'?`${dn(currentUser)} の参加を取り消しました`:`Cancelled attendance for ${currentUser}`);
  } else {
    // remove from absence if present
    if(data.absence?.[ds]?.[ev.id]){
      data.absence[ds][ev.id]=data.absence[ds][ev.id].filter(e=>absentName(e)!==currentUser);
    }
    arr.push(currentUser);
    showToast(lang==='ja'?`✓ ${dn(currentUser)} の参加を記録しました`:`✓ Recorded attendance for ${currentUser}`);
  }
  saveData();
  closeModal('detailOv');
  render();
}

}

function openAbsentModal(ev,ds){
  // Build name select
  const sel=document.getElementById('absentNameSel');
  sel.innerHTML=`<option value="">-- ${lang==='ja'?'選択':'Select'} --</option>`;
  const gP=document.createElement('optgroup');gP.label=lang==='ja'?'選手':'Players';
  PLAYERS.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=dn(n);gP.appendChild(o);});
  sel.appendChild(gP);
  const gF=document.createElement('optgroup');gF.label=lang==='ja'?'フロントオフィス':'Front Office';
  FRONT_OFFICE.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=dn(n);gF.appendChild(o);});
  sel.appendChild(gF);
  if(currentUser) sel.value=currentUser;

  // Check if already absent
  const absents=((data.absence||{})[ds]||{})[ev.id]||[];
  const alreadyAbsent=currentUser&&absents.some(e=>absentName(e)===currentUser);
  const existEntry=alreadyAbsent?absents.find(e=>absentName(e)===currentUser):null;
  document.getElementById('absentTitle').textContent=alreadyAbsent?(lang==='ja'?'✗ 不参加を取り消す':'✗ Cancel Absence'):(lang==='ja'?'✗ 不参加を記録':'✗ Mark Absent');
  document.getElementById('absentSaveBtn').textContent=alreadyAbsent?(lang==='ja'?'不参加を取り消す':'Cancel Absence'):(lang==='ja'?'不参加を記録':'Mark Absent');
  document.getElementById('absentSaveBtn').style.background=alreadyAbsent?'#555':'#7a1a1a';
  document.getElementById('absentReason').value=alreadyAbsent?absentReason(existEntry):'';
  document.getElementById('absentReason').readOnly=alreadyAbsent;
  document.getElementById('absentReason').style.opacity=alreadyAbsent?'0.5':'1';

  _pDetail={ev,ds};
  document.getElementById('absentOv').classList.add('open');
  setTimeout(()=>{ if(!currentUser) sel.focus(); else if(!alreadyAbsent) document.getElementById('absentReason').focus(); },50);
}

function saveAbsent(){
  if(!_pDetail) return;
  const {ev,ds}=_pDetail;
  const name=document.getElementById('absentNameSel').value;
  const reason=document.getElementById('absentReason').value.trim();
  if(!name){document.getElementById('absentNameSel').focus();return;}
  if(!data.absence)data.absence={};
  if(!data.absence[ds])data.absence[ds]={};
  if(!data.absence[ds][ev.id])data.absence[ds][ev.id]=[];
  const arr=data.absence[ds][ev.id];
  const existIdx=arr.findIndex(e=>absentName(e)===name);
  if(existIdx>=0){
    arr.splice(existIdx,1);
    showToast(lang==='ja'?`${dn(name)} の不参加を取り消しました`:`Cancelled absence for ${name}`);
  } else {
    // remove from attendance
    if(data.attendance?.[ds]?.[ev.id]){
      data.attendance[ds][ev.id]=data.attendance[ds][ev.id].filter(n=>n!==name);
    }
    arr.push({name,reason,ts:Date.now()});
    showToast(lang==='ja'?`✗ ${dn(name)} の不参加を記録しました`:`✗ Marked ${name} as absent`);
  }
  closeModal('absentOv');saveData();render();
}

    const fac=FAC_BASE.find(x=>x.id===ev.facId)||FAC_BASE[8];
    const title=isMatch?(ev.memo||facName(ev.facId)):`${facName(ev.facId)}`;
    const atts=((data.attendance||{})[ev.date]||{})[ev.id]||[];
    const absents=((data.absence||{})[ev.date]||{})[ev.id]||[];
    const pC=atts.filter(n=>PLAYERS.includes(n)).length;
    const fC=atts.filter(n=>FRONT_OFFICE.includes(n)).length;
    const attHtml=(pC||fC)?`<div class="sch-att-row">${pC?`<span class="sch-att-pill">${lang==='ja'?`選手${pC}`:`${pC}P`}</span>`:''}${fC?`<span class="sch-att-pill">FO${fC}</span>`:''}</div>`:'';
    html+=`<div class="sch-item" onclick="_openDetailById('${ev.id}')">
      <div class="sch-date-row">${dt.getMonth()+1}/${dt.getDate()} <span class="sch-dow ${dowCls}">${dowLabel}</span><span style="font-size:9px;color:var(--muted)">${formatTimeStr(ev.start)}–${formatTimeStr(ev.end)}</span><span class="sch-arr">›</span></div>
      <div class="sch-title${isMatch?' match':''}">${isMatch?'⚔ ':''}${escHtml(title)}</div>
      ${attHtml}
    </div>`;
  });
  el.innerHTML=html;
}

function _openDetailById(id){
  const ev=data.events&&data.events[id];
  if(ev) openDetail({id,...ev},ev.date);
}

// ============================================================
//  ACCOUNT SELECTOR
// ============================================================
function buildAcctDD(){
  const dd=document.getElementById('acctDD');
  if(!dd) return;
  dd.innerHTML='';
  const guest=document.createElement('div');guest.className='acct-option guest'+(!currentUser?' selected':'');
  guest.textContent=lang==='ja'?'👤 ゲスト':'👤 Guest';
  guest.onclick=()=>setAccount('');dd.appendChild(guest);
  const lblP=document.createElement('div');lblP.className='acct-group-label';lblP.textContent=lang==='ja'?'選手':'Players';dd.appendChild(lblP);
  PLAYERS.forEach(n=>{
    const item=document.createElement('div');item.className='acct-option'+(currentUser===n?' selected':'');
    item.textContent=dn(n);item.onclick=()=>setAccount(n);dd.appendChild(item);
  });
  const div=document.createElement('div');div.className='acct-divider';dd.appendChild(div);
  const lblF=document.createElement('div');lblF.className='acct-group-label';lblF.textContent=lang==='ja'?'フロントオフィス':'Front Office';dd.appendChild(lblF);
  FRONT_OFFICE.forEach(n=>{
    const item=document.createElement('div');item.className='acct-option'+(currentUser===n?' selected':'');
    item.textContent=dn(n);item.onclick=()=>setAccount(n);dd.appendChild(item);
  });
  updateAcctUI();
}
function toggleAcctDD(){
  const btn=document.getElementById('acctBtn');
  const dd=document.getElementById('acctDD');
  if(!btn||!dd) return;
  const isOpen=dd.classList.contains('open');
  if(!isOpen){
    const rect=btn.getBoundingClientRect();
    const w=200;
    let left=rect.right-w;
    if(left<8)left=8;
    if(left+w>window.innerWidth-8)left=window.innerWidth-w-8;
    dd.style.top=(rect.bottom+6)+'px';dd.style.left=left+'px';dd.style.width=w+'px';
  }
  dd.classList.toggle('open',!isOpen);btn.classList.toggle('open',!isOpen);
}
function setAccount(name){
  currentUser=name;localStorage.setItem('sunrise_user_v2',name);
  document.getElementById('acctDD').classList.remove('open');
  document.getElementById('acctBtn').classList.remove('open');
  updateAcctUI();buildAcctDD();render();
}
function updateAcctUI(){
  const btn=document.getElementById('acctBtn');
  const nameEl=document.getElementById('acctName');
  if(!btn||!nameEl) return;
  if(currentUser){btn.classList.add('logged-in');nameEl.textContent=dn(currentUser);}
  else{btn.classList.remove('logged-in');nameEl.textContent=lang==='ja'?'ゲスト':'Guest';}
}

// ============================================================
//  BOARD
// ============================================================
async function openBoard(){
  document.getElementById('boardOv').classList.add('open');
  document.getElementById('boardTA').value='';updateBoardCount();updateBoardWho();
  _boardPosts=await loadBoardPosts();renderBoardPosts();
  document.getElementById('boardBadge').style.display='none';
  localStorage.setItem('sunrise_board_read',Date.now());
}
function updateBoardWho(){
  const el=document.getElementById('boardWho');
  if(el){el.textContent=currentUser?dn(currentUser):(lang==='ja'?'ゲスト':'Guest');el.style.color=currentUser?(FRONT_OFFICE.includes(currentUser)?'#82b1ff':'var(--gold)'):'var(--sub)';}
}
function updateBoardCount(){
  const ta=document.getElementById('boardTA');const ct=document.getElementById('boardCount');
  if(ta&&ct)ct.textContent=`${ta.value.length} / 500`;
}
async function loadBoardPosts(){
  try{ if(window.fbLoad){const d=await window.fbLoad('board');return d?Object.values(d).sort((a,b)=>b.ts-a.ts):[];}}catch(e){}
  try{return JSON.parse(localStorage.getItem('sunrise_board')||'[]');}catch(e){return [];}
}
async function saveBoardPosts(posts){
  try{ if(window.fbSave){const obj={};posts.forEach(p=>{obj['p_'+p.ts]=p;});await window.fbSave(obj,'board');return;}}catch(e){}
  localStorage.setItem('sunrise_board',JSON.stringify(posts));
}
function renderBoardPosts(){
  const el=document.getElementById('boardPosts');
  if(!el) return;
  if(!_boardPosts.length){el.innerHTML=`<div class="board-empty">${lang==='ja'?'まだ投稿がありません':'No posts yet'}</div>`;return;}
  el.innerHTML=_boardPosts.map((p,idx)=>{
    const isFO=FRONT_OFFICE.includes(p.author);
    const isMe=p.author===currentUser;
    const canDel=isMe||isEdit;
    const dt=new Date(p.ts);
    const ts=`${dt.getFullYear()}/${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
    const acks=p.acks||[];
    const iAcked=currentUser&&acks.includes(currentUser);
    const ackTags=acks.map(n=>`<span class="board-ack-tag">${dn(n)}</span>`).join('');
    return `<div class="board-post">
      <div class="board-post-hdr">
        <span class="board-post-time">${ts}</span>
        <span class="board-post-author${isFO?' fo':''}">${p.author?dn(p.author):(lang==='ja'?'ゲスト':'Guest')}</span>
        ${isFO?`<span style="font-size:9px;padding:1px 5px;border-radius:8px;background:rgba(130,177,255,.1);color:#82b1ff">FO</span>`:''}
        ${canDel?`<button class="board-post-del" onclick="delBoardPost(${idx})">✕ 削除</button>`:''}
      </div>
      <div class="board-post-body">${escHtml(p.body)}</div>
      <div class="board-ack-row">
        <span class="board-ack-lbl">${lang==='ja'?'了解:':'Ack:'}</span>
        ${ackTags}
        <button class="board-ack-btn${iAcked?' acked':''}" onclick="toggleAck(${idx})">${iAcked?(lang==='ja'?'✓ 了解済':'✓ OK'):(lang==='ja'?'👍 了解':'👍 OK')}</button>
      </div>
    </div>`;
  }).join('');
}
async function postBoard(){
  const ta=document.getElementById('boardTA');const body=ta.value.trim();if(!body)return;
  const post={author:currentUser||(lang==='ja'?'ゲスト':'Guest'),body,ts:Date.now()};
  _boardPosts.unshift(post);await saveBoardPosts(_boardPosts);ta.value='';updateBoardCount();renderBoardPosts();
  showToast(lang==='ja'?'📣 投稿しました':'📣 Posted');
}
async function delBoardPost(idx){_boardPosts.splice(idx,1);await saveBoardPosts(_boardPosts);renderBoardPosts();}
async function toggleAck(idx){
  if(!currentUser){showToast(lang==='ja'?'名前を選択してください':'Please select your name');return;}
  if(!_boardPosts[idx]) return;
  if(!_boardPosts[idx].acks)_boardPosts[idx].acks=[];
  const acks=_boardPosts[idx].acks;
  if(acks.includes(currentUser)){_boardPosts[idx].acks=acks.filter(n=>n!==currentUser);}
  else{acks.push(currentUser);}
  await saveBoardPosts(_boardPosts);renderBoardPosts();
}

// ============================================================
//  ANALYTICS
// ============================================================
function openAnalytics(){
  _amTab='players';
  document.querySelectorAll('.am-tab').forEach((b,i)=>b.classList.toggle('active',i===0));
  document.getElementById('amOv').classList.add('open');
  renderAnalytics();
}
function switchAmTab(tab){
  _amTab=tab;
  document.querySelectorAll('.am-tab').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick').includes(tab)));
  renderAnalytics();
}
function renderAnalytics(){
  const el=document.getElementById('amBody');
  const events=Object.entries(data.events||{}).map(([id,e])=>({id,...e}));
  const att=data.attendance||{};
  const abs=data.absence||{};
  const DOW_JA=['日','月','火','水','木','金','土'];

  if(_amTab==='players'||_amTab==='fo'){
    const names=_amTab==='players'?PLAYERS:FRONT_OFFICE;
    const tagCls=_amTab==='players'?'p':'fo';
    const total=events.length;
    const rows=names.map(name=>{
      let cnt=0;
      events.forEach(ev=>{if((att[ev.date]?.[ev.id]||[]).includes(name))cnt++;});
      const pct=total>0?Math.round(cnt/total*100):0;
      return{name,cnt,pct};
    }).sort((a,b)=>b.cnt-a.cnt);
    const avg=rows.length>0?Math.round(rows.reduce((s,r)=>s+r.pct,0)/rows.length):0;
    let html=`<div class="am-grid">
      <div class="am-card"><div class="av">${total}</div><div class="al">${lang==='ja'?'イベント数':'Events'}</div></div>
      <div class="am-card"><div class="av">${avg}%</div><div class="al">${lang==='ja'?'平均参加率':'Avg rate'}</div></div>
      <div class="am-card"><div class="av" style="font-size:14px">${rows[0]?dn(rows[0].name):'-'}</div><div class="al">${lang==='ja'?'最多参加':'Top attendee'}</div></div>
    </div>
    <div class="am-sec">${lang==='ja'?'参加状況':'Attendance'}</div>
    <table class="am-table"><thead><tr><th>${lang==='ja'?'名前':'Name'}</th><th>${lang==='ja'?'参加':'Count'}</th><th style="min-width:100px">${lang==='ja'?'参加率':'Rate'}</th></tr></thead><tbody>`;
    rows.forEach(r=>{
      const bc=r.pct>=70?'':r.pct>=40?'mid':'low';
      const color=bc===''?'#51cf66':bc==='mid'?'#ffd43b':'#ff8787';
      html+=`<tr><td><span class="am-tag ${tagCls}">${dn(r.name)}</span></td><td style="font-family:'DM Mono',monospace">${r.cnt} / ${total}</td><td><div style="display:flex;align-items:center;gap:6px"><div class="am-bar-w"><div class="am-bar ${bc}" style="width:${r.pct}%"></div></div><span class="am-pct" style="color:${color}">${r.pct}%</span></div></td></tr>`;
    });
    html+='</tbody></table>';
    el.innerHTML=html;

  } else if(_amTab==='sessions'){
    const rows=events.map(ev=>{
      const atts=((att[ev.date]||{})[ev.id])||[];
      const dt=new Date(ev.date+'T00:00:00');
      const pC=atts.filter(n=>PLAYERS.includes(n)).length;
      const fC=atts.filter(n=>FRONT_OFFICE.includes(n)).length;
      return{ev,dt,atts,pC,fC};
    }).sort((a,b)=>a.ev.date.localeCompare(b.ev.date)||a.ev.start.localeCompare(b.ev.start));
    const avg=rows.length?Math.round(rows.reduce((s,r)=>s+r.pC,0)/rows.length*10)/10:0;
    let html=`<div class="am-grid">
      <div class="am-card"><div class="av">${events.length}</div><div class="al">${lang==='ja'?'イベント数':'Events'}</div></div>
      <div class="am-card"><div class="av">${avg}</div><div class="al">${lang==='ja'?'平均参加選手数':'Avg players'}</div></div>
      <div class="am-card"><div class="av">${PLAYERS.length}</div><div class="al">${lang==='ja'?'登録選手数':'Roster'}</div></div>
    </div>
    <div class="am-sec">${lang==='ja'?'セッション別':'By session'}</div>
    <table class="am-table"><thead><tr><th>${lang==='ja'?'日付':'Date'}</th><th>${lang==='ja'?'時間':'Time'}</th><th>${lang==='ja'?'施設':'Venue'}</th><th>${lang==='ja'?'選手':'Players'}</th><th>FO</th></tr></thead><tbody>`;
    rows.forEach(r=>{
      const dow=r.dt.getDay();
      html+=`<tr><td style="font-family:'DM Mono',monospace;white-space:nowrap">${r.dt.getMonth()+1}/${r.dt.getDate()}(${DOW_JA[dow]})</td><td style="font-family:'DM Mono',monospace">${formatTimeStr(r.ev.start)}–${formatTimeStr(r.ev.end)}</td><td style="font-size:11px">${escHtml(facName(r.ev.facId))}</td><td style="font-family:'DM Mono',monospace">${r.pC}</td><td style="font-family:'DM Mono',monospace">${r.fC}</td></tr>`;
    });
    html+='</tbody></table>';
    el.innerHTML=html;

  } else if(_amTab==='absences'){
    const rows=[];
    events.forEach(ev=>{
      const evAbs=(abs[ev.date]||{})[ev.id]||[];
      evAbs.forEach(e=>rows.push({ev,name:absentName(e),reason:absentReason(e),dt:new Date(ev.date+'T00:00:00')}));
    });
    rows.sort((a,b)=>a.ev.date.localeCompare(b.ev.date));
    let html=`<div class="am-grid">
      <div class="am-card"><div class="av">${rows.length}</div><div class="al">${lang==='ja'?'欠席総数':'Total absences'}</div></div>
      <div class="am-card"><div class="av">${rows.filter(r=>r.reason).length}</div><div class="al">${lang==='ja'?'理由あり':'With reason'}</div></div>
      <div class="am-card"><div class="av">${new Set(rows.map(r=>r.name)).size}</div><div class="al">${lang==='ja'?'欠席人数':'Unique absent'}</div></div>
    </div>
    <div class="am-sec">${lang==='ja'?'欠席理由一覧':'Absence log'}</div>`;
    if(!rows.length){html+=`<div style="text-align:center;color:var(--muted);padding:30px;font-size:12px">${lang==='ja'?'欠席記録なし':'No absences recorded'}</div>`;}
    else{
      html+=`<table class="am-table"><thead><tr><th>${lang==='ja'?'日付':'Date'}</th><th>${lang==='ja'?'時間':'Time'}</th><th>${lang==='ja'?'施設':'Venue'}</th><th>${lang==='ja'?'名前':'Name'}</th><th>${lang==='ja'?'理由':'Reason'}</th></tr></thead><tbody>`;
      rows.forEach(r=>{
        const isFO=FRONT_OFFICE.includes(r.name);
        html+=`<tr><td style="font-family:'DM Mono',monospace">${r.dt.getMonth()+1}/${r.dt.getDate()}</td><td style="font-family:'DM Mono',monospace">${formatTimeStr(r.ev.start)}–${formatTimeStr(r.ev.end)}</td><td style="font-size:11px">${escHtml(facName(r.ev.facId))}</td><td><span class="am-tag ${isFO?'fo':'p'}">${dn(r.name)}</span></td><td style="color:var(--sub);font-size:11px">${r.reason||'<span style="color:var(--muted)">—</span>'}</td></tr>`;
      });
      html+='</tbody></table>';
    }
    el.innerHTML=html;
  }
}

// ============================================================

// ============================================================
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
function ovClose(e,id){ if(e.target===document.getElementById(id)) closeModal(id); }
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') ['evOv','detailOv','editOv','absentOv','confirmOv','boardOv','amOv'].forEach(id=>closeModal(id));
});
document.addEventListener('click',e=>{
  const c=document.getElementById('acctContainer');
  if(c&&!c.contains(e.target)){
    document.getElementById('acctDD')?.classList.remove('open');
    document.getElementById('acctBtn')?.classList.remove('open');
  }
});

// ============================================================
//  INIT
// ============================================================
async function startApp(){
  setSyncing('busy','読み込み中…');
  await loadData();
  // Scroll to current time or 7:00
  const y=nowY();
  const wrap=document.getElementById('calScrollWrap');
  if(wrap) wrap.scrollTop=y!==null?Math.max(0,y-120):timeToY('07:00');
  buildAcctDD();
  render();
  // Realtime sync
  if(window.fbWatch){
    let first=true;
    window.fbWatch(newData=>{
      if(first){first=false;return;}
      data=newData;
      if(!data.events)data.events={};
      if(!data.attendance)data.attendance={};
      if(!data.absence)data.absence={};
      render();showToast('🔄 データを更新しました');
    });
  }
}

if(window._fbReady){ startApp(); }
else { window._fbReadyCb=startApp; setTimeout(()=>{if(!window._fbReady)startApp();},3000); }
